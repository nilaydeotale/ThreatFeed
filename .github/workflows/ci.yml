name: CI

on:
  # Pull requests only: running on branch pushes too made every PR update run twice.
  # main is covered by the deploy workflow, which runs the same checks.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
