name: CI

on:
  # Pull requests only: running on branch pushes too made every PR update run twice.
  # main is covered by the deploy workflow, which runs the same checks.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Bundle Size
        run: |
          DIST_SIZE=$(du -sk dist | cut -f1)
          echo "Total bundle size: ${DIST_SIZE} KB"
          # Set limit to 10MB (10240 KB)
          if [ $DIST_SIZE -gt 10240 ]; then
            echo "Error: Bundle size exceeds 10MB limit!"
            exit 1
          fi
